# Config para tst/full_test_suite.py (busca estas rutas fijas):
#   /post_body  /uploads  /directory  /redirect  error_page 404  2+ servers
#
#   bash tst/tests_42/setup.sh                       # crea tst/tests_42/YoupiBanane
#   ./webserv etc/testing.conf
#   python3 tst/full_test_suite.py --config etc/testing.conf
#
# Los POST a /post_body se guardan en /tmp; los de /uploads, en www/uploads.

server {
    listen 8080;
    root www/;
    client_max_body_size 10M;
    error_page 404 tst/testing/404.html;

    location / {
        allowed_methods GET;
    }

    # POST de cualquier body de hasta 100 bytes
    location /post_body {
        client_max_body_size 100;
        upload_enabled on;
        upload_path /tmp;
        allowed_methods POST;
    }

    # Listado, descarga y borrado de www/uploads; subidas de hasta 100 bytes
    # (POST /uploads/foto.png guarda www/uploads/foto.png)
    location /uploads {
        root www/uploads;
        autoindex on;
        upload_enabled on;
        upload_path www/uploads;
        client_max_body_size 100;
        allowed_methods GET POST DELETE;
    }

    # El escenario del tester de 42: YoupiBanane, index youpi.bad_extension,
    # .bla -> CGI (youpi.bla es un script de Python, ver setup.sh)
    location /directory {
        root tst/tests_42/YoupiBanane;
        index youpi.bad_extension;
        cgi .bla /usr/bin/python3;
        client_max_body_size 100;
        allowed_methods GET POST;
    }

    location /redirect {
        redirect 301 /;
        allowed_methods GET;
    }
}

# Segundo servidor (otro puerto, otro contenido)
server {
    listen 8081;
    root www/site2/;
    location / {
        allowed_methods GET;
    }
}
