# Configuración de demostración de webserv.
# Arrancar con:  ./webserv   (o ./webserv etc/default.conf)
#
#   http://localhost:8080/                 sitio principal (estático)
#   http://localhost:8080/showUploads      subir, listar, descargar y borrar ficheros
#   http://localhost:8080/cgi/example.py   CGI (GET y POST)
#   http://localhost:8080/old              redirección 301 a /
#   http://127.0.0.1:8081/                 segundo sitio: otra interfaz, otro puerto, otro root

server {
    listen 0.0.0.0:8080;
    root www/;
    client_max_body_size 10M;

    # Páginas de error: por defecto se usa la plantilla www/err/template.html.
    # Para usar una página propia para un código, créala y descomenta:
    # error_page 404 www/err/mi_404.html;

    # Sitio estático: solo lectura. Un directorio sirve su index.html
    # (/showUploads -> www/showUploads/index.html)
    location / {
        index index.html;
        allowed_methods GET;
    }

    # Scripts CGI por extensión: /cgi/example.py -> python3 www/cgi/example.py
    location /cgi {
        root www/cgi;
        cgi .py /usr/bin/python3;
        allowed_methods GET POST;
    }

    # Subida de ficheros (formulario de index.html)
    location /upload {
        upload_enabled on;
        upload_path www/uploads;
        allowed_methods POST;
    }

    # Ficheros subidos: listar (autoindex), descargar y borrar
    # /uploads/          -> listado del directorio (HTML, o JSON para /showUploads)
    # /uploads/foto.png  -> www/uploads/foto.png
    location /uploads {
        root www/uploads;
        autoindex on;
        allowed_methods GET DELETE;
    }

    # Redirección
    location /old {
        redirect 301 /;
        allowed_methods GET;
    }
}

# Segundo sitio: otra interfaz (127.0.0.1), otro puerto, otro contenido y un
# límite de body muy pequeño para probarlo con curl:
#   curl -X POST -H "Content-Type: plain/text" --data "corto" http://127.0.0.1:8081/          -> 200
#   curl -X POST -H "Content-Type: plain/text" --data "$(printf 'x%.0s' {1..200})" http://127.0.0.1:8081/   -> 413
server {
    listen 127.0.0.1:8081;
    root www/site2/;
    client_max_body_size 100;

    location / {
        index index.html;
        upload_enabled on;
        upload_path /tmp;
        allowed_methods GET POST;
    }
}
