# You can have comments starting with # anywhere in the file!

server {
    # 1. Server Basics
    listen 127.0.0.1:8080 ;
    root /var/www/my_website ;
    client_max_body_size 1024000 ;

    # 2. Custom Error Pages
    error_page 400 /errors/400.html ;
    error_page 403 /errors/403.html ;
    error_page 404 /errors/404.html ;
    error_page 500 /errors/500.html ;

    # 3. Location Block: Standard serving with autoindex
    location / {
        root /var/www/my_website ;
        index index.html ;
        autoindex on ;
        allowed_methods GET POST ;
    }

    # 4. Location Block: Aliased directory (serving files from somewhere else)
    location /images {
        alias /var/www/static/img ;
        autoindex off ;
        allowed_methods GET ;
    }

    # 5. Location Block: Upload endpoint
    location /upload {
        root /var/www/my_website/upload_app ;
        upload_enabled on ;
        upload_path /var/www/uploads ;
        allowed_methods POST DELETE ;
    }

    # 6. Location Block: Redirection
    location /legacy {
        redirect 301 /new-page.html ;
        allowed_methods GET ;
    }
}

# You can define a completely separate virtual server just by adding another block
server {
    listen 0.0.0.0:8443 ;
    root /var/www/secure ;
    client_max_body_size 500 ;

    location / {
        index index.html ;
        allowed_methods GET ;
    }
}
