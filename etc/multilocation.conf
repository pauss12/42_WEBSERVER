# Comprehensive Configuration
listen 443 ;
root /var/www/main ;
client_max_body_size 1024000 ;
error_page 403 /errors/403.html ;
error_page 501 /errors/501.html ;
error_page 400 /errors/400.html ;

location / {
    autoindex off ;
    index index.html ;
    allowed_methods GET ;
}

location /submit {
    allowed_methods POST ;
    upload_enabled on ;
    upload_path /tmp/data ;
}

location /legacy {
    redirect 302 / ;
}